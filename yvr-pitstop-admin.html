<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YVR PitStop — Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

    /* LOGIN */
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: #fff; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
    .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .login-logo svg { width: 44px; height: 44px; border-radius: 12px; }
    .login-logo-text h1 { font-size: 18px; font-weight: 700; color: #0D3D6B; }
    .login-logo-text p { font-size: 12px; color: #888780; }
    .login-label { font-size: 12px; font-weight: 600; color: #5f5e5a; margin-bottom: 6px; display: block; }
    .login-input { width: 100%; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 14px; }
    .login-input:focus { border-color: #0D3D6B; }
    .login-btn { width: 100%; padding: 12px; background: #0D3D6B; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login-btn:hover { background: #0a2e52; }
    .login-error { color: #D85A30; font-size: 13px; margin-top: 10px; display: none; }

    /* DASHBOARD */
    .dashboard { display: none; }
    .topbar { background: #0D3D6B; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-brand { display: flex; align-items: center; gap: 10px; }
    .topbar-brand svg { width: 36px; height: 36px; border-radius: 9px; }
    .topbar-title { font-size: 16px; font-weight: 700; color: #fff; }
    .topbar-sub { font-size: 11px; color: rgba(255,255,255,0.6); }
    .logout-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; font-size: 12px; cursor: pointer; }

    .dashboard-body { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .stat-label { font-size: 11px; color: #888780; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 700; color: #1a1a18; }
    .stat-value.pending { color: #E8A020; }
    .stat-value.approved { color: #3B9E5A; }
    .stat-value.rejected { color: #D85A30; }

    .section-title { font-size: 16px; font-weight: 700; color: #1a1a18; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .ftab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #5f5e5a; }
    .ftab.active { background: #0D3D6B; border-color: #0D3D6B; color: #fff; }

    .submissions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .sub-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.08); transition: box-shadow 0.15s; }
    .sub-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .sub-photo { width: 100%; height: 180px; object-fit: cover; background: #f0f2f5; display: block; cursor: pointer; }
    .sub-photo-placeholder { width: 100%; height: 180px; background: #f0f2f5; display: flex; align-items: center; justify-content: center; color: #888780; font-size: 13px; }
    .sub-body { padding: 14px; }
    .sub-type-badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .sub-type-badge.fountain { background: #E6F4FF; color: #0D5FA5; }
    .sub-type-badge.washroom { background: #FDEEE8; color: #A83A10; }
    .sub-type-badge.restspot { background: #E8F5EE; color: #1E6B3A; }
    .sub-name { font-size: 15px; font-weight: 600; color: #1a1a18; margin-bottom: 4px; }
    .sub-desc { font-size: 13px; color: #5f5e5a; margin-bottom: 8px; line-height: 1.4; }
    .sub-meta { font-size: 11px; color: #888780; margin-bottom: 12px; display: flex; flex-direction: column; gap: 3px; }
    .sub-meta span { display: flex; align-items: center; gap: 5px; }
    .sub-actions { display: flex; gap: 8px; }
    .approve-btn { flex: 1; padding: 9px; border-radius: 8px; border: none; background: #3B9E5A; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .approve-btn:hover { background: #2d7a45; }
    .reject-btn { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #D85A30; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .reject-btn:hover { background: #fdf0ed; }
    .maps-link { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 7px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); background: #f5f5f3; color: #0D3D6B; font-size: 12px; text-decoration: none; font-weight: 500; }
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .status-badge.approved { background: #E8F5EE; color: #1E6B3A; }
    .status-badge.rejected { background: #FDEEE8; color: #A83A10; }
    .status-badge.pending { background: #FFF3CD; color: #8A5500; }
    .empty-state { padding: 48px 24px; text-align: center; color: #888780; }
    .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; }
    .loading-state { padding: 48px 24px; text-align: center; color: #888780; }
    .photo-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
    .photo-modal.visible { display: flex; }
    .photo-modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }
    .photo-modal-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
        <rect width="180" height="180" rx="40" fill="#0D3D6B"/>
        <path d="M90 28 C90 28 50 72 50 97 C50 121 68 140 90 140 C112 140 130 121 130 97 C130 72 90 28 90 28Z" fill="#4AADE8"/>
        <path d="M72 114 C72 114 60 102 60 91" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <text x="90" y="166" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#4AADE8" letter-spacing="3">YVR</text>
      </svg>
      <div class="login-logo-text">
        <h1>YVR PitStop</h1>
        <p>Admin Dashboard</p>
      </div>
    </div>
    <label class="login-label">Password</label>
    <input class="login-input" type="password" id="admin-password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Log In</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">
      <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
        <rect width="180" height="180" rx="40" fill="#0D3D6B"/>
        <path d="M90 28 C90 28 50 72 50 97 C50 121 68 140 90 140 C112 140 130 121 130 97 C130 72 90 28 90 28Z" fill="#4AADE8"/>
        <text x="90" y="166" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#4AADE8" letter-spacing="3">YVR</text>
      </svg>
      <div>
        <div class="topbar-title">YVR PitStop</div>
        <div class="topbar-sub">Submissions Admin</div>
      </div>
    </div>
    <button class="logout-btn" onclick="doLogout()"><i class="ti ti-logout"></i> Log out</button>
  </div>

  <div class="dashboard-body">
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-label">Total Submissions</div><div class="stat-value" id="stat-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Pending Review</div><div class="stat-value pending" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">Approved & Live</div><div class="stat-value approved" id="stat-approved">—</div></div>
      <div class="stat-card"><div class="stat-label">Rejected</div><div class="stat-value rejected" id="stat-rejected">—</div></div>
    </div>

    <div class="section-title"><i class="ti ti-inbox"></i> Submissions</div>
    <div class="filter-tabs">
      <div class="ftab active" onclick="setAdminFilter('pending',this)">⏳ Pending</div>
      <div class="ftab" onclick="setAdminFilter('approved',this)">✅ Approved</div>
      <div class="ftab" onclick="setAdminFilter('rejected',this)">❌ Rejected</div>
      <div class="ftab" onclick="setAdminFilter('all',this)">All</div>
    </div>

    <div id="submissions-container">
      <div class="loading-state"><i class="ti ti-loader" style="font-size:32px;display:block;margin-bottom:8px"></i>Loading submissions...</div>
    </div>
  </div>
</div>

<!-- PHOTO MODAL -->
<div class="photo-modal" id="photo-modal" onclick="closePhotoModal()">
  <button class="photo-modal-close" onclick="closePhotoModal()"><i class="ti ti-x"></i></button>
  <img id="photo-modal-img" src="" alt="Full photo"/>
</div>

<script>
var SUPA_URL = 'https://wmmxtwzupqmtpkzzvypn.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbXh0d3p1cHFtdHBrenp2eXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNzcxODMsImV4cCI6MjA5NTg1MzE4M30.UeUvsvd21VrFOtPaJFZ9zRook5W1j16faOtx0jmOQl8';
var ADMIN_PASSWORD = 'yvradmin2024'; // change this to your own password
var currentFilter = 'pending';
var allSubs = [];

function doLogin() {
  var pw = document.getElementById('admin-password').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadSubmissions();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('admin-password').value = '';
}

function setAdminFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  renderSubmissions();
}

async function loadSubmissions() {
  try {
    var res = await fetch(SUPA_URL + '/rest/v1/contributions?select=*&order=created_at.desc', {
      headers: { 'Authorization': 'Bearer ' + SUPA_KEY, 'apikey': SUPA_KEY }
    });
    allSubs = await res.json();
    updateStats();
    renderSubmissions();
  } catch(e) {
    document.getElementById('submissions-container').innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle"></i>Failed to load submissions</div>';
  }
}

function updateStats() {
  document.getElementById('stat-total').textContent = allSubs.length;
  document.getElementById('stat-pending').textContent = allSubs.filter(function(s){return s.status==='pending';}).length;
  document.getElementById('stat-approved').textContent = allSubs.filter(function(s){return s.status==='approved';}).length;
  document.getElementById('stat-rejected').textContent = allSubs.filter(function(s){return s.status==='rejected';}).length;
}

function renderSubmissions() {
  var list = currentFilter === 'all' ? allSubs : allSubs.filter(function(s){return s.status===currentFilter;});
  var container = document.getElementById('submissions-container');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state"><i class="ti ti-inbox"></i>No '+currentFilter+' submissions</div>';
    return;
  }
  container.innerHTML = '<div class="submissions-grid">' + list.map(function(s) {
    var typeLabel = s.type==='fountain'?'Free Drinking Water':s.type==='washroom'?'Public Washroom':'Rest Spot';
    var photoHtml = s.photo_url
      ? '<img class="sub-photo" src="'+s.photo_url+'" loading="lazy" onclick="openPhoto(\''+s.photo_url+'\')" title="Click to enlarge"/>'
      : '<div class="sub-photo-placeholder"><i class="ti ti-photo" style="font-size:32px"></i></div>';
    var date = new Date(s.created_at).toLocaleDateString('en-CA', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    var mapsUrl = 'https://www.google.com/maps?q='+s.lat+','+s.lng;
    var actionsHtml = s.status === 'pending'
      ? '<button class="approve-btn" onclick="updateStatus(\''+s.id+'\',\'approved\')"><i class="ti ti-check"></i> Approve</button>'
        + '<button class="reject-btn" onclick="updateStatus(\''+s.id+'\',\'rejected\')"><i class="ti ti-x"></i> Reject</button>'
      : '<span class="status-badge '+s.status+'">'+( s.status==='approved'?'✅ Approved':'❌ Rejected')+'</span>';
    return '<div class="sub-card" id="card-'+s.id+'">'
      + photoHtml
      + '<div class="sub-body">'
      + '<div class="sub-type-badge '+s.type+'">'+typeLabel+'</div>'
      + '<div class="sub-name">'+s.name+'</div>'
      + (s.description ? '<div class="sub-desc">'+s.description+'</div>' : '')
      + '<div class="sub-meta">'
      + '<span><i class="ti ti-calendar" style="font-size:12px"></i>'+date+'</span>'
      + '<span><i class="ti ti-map-pin" style="font-size:12px"></i>'+s.lat.toFixed(5)+', '+s.lng.toFixed(5)+'</span>'
      + '</div>'
      + '<div class="sub-actions" style="margin-bottom:8px">'+actionsHtml+'</div>'
      + '<a class="maps-link" href="'+mapsUrl+'" target="_blank"><i class="ti ti-map-2" style="font-size:14px"></i> View on Google Maps</a>'
      + '</div></div>';
  }).join('') + '</div>';
}

async function updateStatus(id, status) {
  try {
    var res = await fetch(SUPA_URL + '/rest/v1/contributions?id=eq.'+id, {
      method: 'PATCH',
      headers: {
        'Authorization': 'Bearer ' + SUPA_KEY,
        'apikey': SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ status: status })
    });
    if (!res.ok) throw new Error('Update failed');
    // Update locally
    allSubs = allSubs.map(function(s){ return s.id===id ? Object.assign({},s,{status:status}) : s; });
    updateStats();
    renderSubmissions();
  } catch(e) {
    alert('Failed to update. Please try again.');
  }
}

function openPhoto(url) {
  document.getElementById('photo-modal-img').src = url;
  document.getElementById('photo-modal').classList.add('visible');
}

function closePhotoModal() {
  document.getElementById('photo-modal').classList.remove('visible');
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePhotoModal(); });
</script>
</body>
</html>
